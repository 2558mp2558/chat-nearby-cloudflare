name = "chat-nearby-samutsongkhram"
main = "worker.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/events", "/pic/*"]

[[durable_objects.bindings]]
name = "CHATROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
